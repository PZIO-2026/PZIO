components:
  schemas:
    ActivityLogRead:
      properties:
        activityLogId:
          type: integer
          title: Activitylogid
        taskId:
          type: integer
          title: Taskid
        userId:
          type: integer
          title: Userid
        action:
          type: string
          title: Action
        fieldName:
          anyOf:
          - type: string
          - type: 'null'
          title: Fieldname
        oldValue:
          anyOf:
          - type: string
          - type: 'null'
          title: Oldvalue
        newValue:
          anyOf:
          - type: string
          - type: 'null'
          title: Newvalue
        createdAt:
          type: string
          format: date-time
          title: Createdat
      type: object
      required:
      - activityLogId
      - taskId
      - userId
      - action
      - createdAt
      title: ActivityLogRead
      description: Single audit entry returned by `GET /api/tasks/{id}/history` (SAD §4.5).
      example:
        action: STATUS_CHANGE
        activityLogId: 87
        createdAt: '2026-05-14T13:15:00Z'
        fieldName: status
        newValue: InProgress
        oldValue: ToDo
        taskId: 123
        userId: 42
    AttachmentRead:
      properties:
        attachmentId:
          type: integer
          title: Attachmentid
        taskId:
          type: integer
          title: Taskid
        uploaderId:
          type: integer
          title: Uploaderid
        filename:
          type: string
          title: Filename
        contentType:
          type: string
          title: Contenttype
        fileSize:
          type: integer
          title: Filesize
        createdAt:
          type: string
          format: date-time
          title: Createdat
      type: object
      required:
      - attachmentId
      - taskId
      - uploaderId
      - filename
      - contentType
      - fileSize
      - createdAt
      title: AttachmentRead
      description: Public attachment representation (excludes internal file_path).
      example:
        attachmentId: 4
        contentType: image/png
        createdAt: '2026-05-14T18:00:00Z'
        fileSize: 184302
        filename: auth-flow.png
        taskId: 123
        uploaderId: 42
    BackupRead:
      properties:
        backupId:
          type: integer
          title: Backupid
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        status:
          type: string
          title: Status
      type: object
      required:
      - backupId
      - timestamp
      - status
      title: BackupRead
      description: 'Response for `POST /api/admin/backups` (SAD §4.5).


        PDF specifies the response shape as `{backupId, timestamp, status}` —

        `timestamp` is read from the ORM column `created_at` via `validation_alias`.'
      example:
        backupId: 12
        status: completed
        timestamp: '2026-05-14T03:00:00Z'
    Body_upload_attachment_api_tasks__task_id__attachments_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_attachment_api_tasks__task_id__attachments_post
    BurndownDay:
      properties:
        date:
          type: string
          format: date-time
          title: Date
        remainingPoints:
          type: integer
          title: Remainingpoints
      type: object
      required:
      - date
      - remainingPoints
      title: BurndownDay
      description: Single data point on the burndown chart.
      example:
        date: '2026-05-15T00:00:00Z'
        remainingPoints: 34
    BurndownOut:
      properties:
        sprintId:
          type: integer
          title: Sprintid
        totalPoints:
          type: integer
          title: Totalpoints
        days:
          items:
            $ref: '#/components/schemas/BurndownDay'
          type: array
          title: Days
      type: object
      required:
      - sprintId
      - totalPoints
      - days
      title: BurndownOut
      description: Response body for GET /api/sprints/{id}/burndown.
      example:
        days:
        - date: '2026-05-15T00:00:00Z'
          remainingPoints: 34
        - date: '2026-05-16T00:00:00Z'
          remainingPoints: 31
        - date: '2026-05-17T00:00:00Z'
          remainingPoints: 27
        sprintId: 21
        totalPoints: 34
    CommentCreate:
      properties:
        content:
          type: string
          maxLength: 10000
          minLength: 1
          title: Content
      type: object
      required:
      - content
      title: CommentCreate
      description: Body for POST /api/tasks/{id}/comments
      example:
        content: Pushed the fix to the feature branch — please review when you get a chance.
    CommentRead:
      properties:
        commentId:
          type: integer
          title: Commentid
        taskId:
          type: integer
          title: Taskid
        authorId:
          type: integer
          title: Authorid
        content:
          type: string
          title: Content
        createdAt:
          type: string
          format: date-time
          title: Createdat
        updatedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updatedat
      type: object
      required:
      - commentId
      - taskId
      - authorId
      - content
      - createdAt
      title: CommentRead
      description: Public comment representation.
      example:
        authorId: 42
        commentId: 17
        content: Pushed the fix to the feature branch — please review when you get a chance.
        createdAt: '2026-05-14T17:30:00Z'
        taskId: 123
    CommentUpdate:
      properties:
        content:
          type: string
          maxLength: 10000
          minLength: 1
          title: Content
      type: object
      required:
      - content
