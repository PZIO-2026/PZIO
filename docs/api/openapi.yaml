openapi: 3.1.0
info:
  title: PZIO Task Management System
  description: Backend REST API for the team-project task management system. See documents/4.pdf (SAD)
    for the canonical API contract.
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - Health
      summary: Liveness probe
      description: 'Operational liveness check used by Docker, Kubernetes and load balancers. Returns
        `{"status": "ok"}` whenever the API process is reachable; no authentication required. Outside
        the SAD business API surface on purpose.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /api/auth/register:
    post:
      tags:
      - Auth
      summary: Register a new user
      description: Creates a user with role `TeamMember`. Returns the user without the password hash.
      operationId: register_api_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '400':
          description: Validation error
        '409':
          description: Email already in use
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/login:
    post:
      tags:
      - Auth
      summary: Log in with email and password
      description: 'Returns a JWT access token. Use it as `Authorization: Bearer <token>` on protected
        routes.'
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/users/me:
    get:
      tags:
      - Auth
      summary: Get current user profile
      description: Returns the profile of the currently authenticated user.
      operationId: get_profile_api_users_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
      security:
      - HTTPBearer: []
    patch:
      tags:
      - Auth
      summary: Update current user profile
      description: Updates the profile of the currently authenticated user. All fields are optional.
      operationId: update_profile_api_users_me_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/users:
    get:
      tags:
      - Auth
      summary: List users (Admin)
      description: Returns a paginated list of users. Requires Administrator role.
      operationId: list_users_api_users_get
      security:
      - HTTPBearer: []
      parameters:
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search by email, first name, or last name
          title: Search
        description: Search by email, first name, or last name
      - name: isActive
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filter by active status
          title: Isactive
        description: Filter by active status
      - name: sortBy
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Field to sort by
          title: Sortby
        description: Field to sort by
      - name: sortDirection
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Sort direction (asc or desc)
          default: desc
          title: Sortdirection
        description: Sort direction (asc or desc)
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number
          default: 1
          title: Page
        description: Page number
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page
          default: 50
          title: Size
        description: Items per page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/users/{id}/status:
    patch:
      tags:
      - Auth
      summary: Change user status (Admin)
      description: Activates or deactivates a user account. Requires Administrator role.
      operationId: update_user_status_api_users__id__status_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '404':
          description: User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/users/{id}/role:
    patch:
      tags:
      - Auth
      summary: Change user role (Admin)
      description: Promotes or demotes a user to another role. Requires Administrator role. Admin cannot
        change their own role.
      operationId: update_user_role_api_users__id__role_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '400':
          description: Cannot change own role
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - Administrator role required
        '404':
          description: User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/reset-password:
    post:
      tags:
      - Auth
      summary: Request a password reset
      description: Sends a password reset link to the provided email if the account exists.
      operationId: request_password_reset_api_auth_reset_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/reset-password/confirm:
    post:
      tags:
      - Auth
      summary: Confirm password reset
      description: Sets a new password using a valid reset token.
      operationId: confirm_password_reset_api_auth_reset_password_confirm_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid or expired token
        '404':
          description: User not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/oauth:
    post:
      tags:
      - Auth
      summary: Log in with OAuth provider
      description: Authenticates a user via external provider (Google/GitHub) and returns a JWT.
      operationId: oauth_login_api_auth_oauth_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Unsupported provider
        '401':
          description: Invalid OAuth token
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/projects:
    post:
      tags:
      - Projects
      summary: Create a new project
      description: Creates a new project owned by the calling user. The caller is automatically added
        as a member with the `project_owner` role. Any authenticated user can create projects.
      operationId: create_project_api_projects_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Projects
      summary: List projects the current user is a member of
      description: Returns a paginated list of projects the caller is a member of. Supports filtering
        by `status`, free-text `search` over the name, and sorting via `sortBy` (`created_at`, `name`,
        `updated_at`) + `sortDirection` (`asc`/`desc`).
      operationId: list_projects_api_projects_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      - name: sortBy
        in: query
        required: false
        schema:
          type: string
          default: created_at
          title: Sortby
      - name: sortDirection
        in: query
        required: false
        schema:
          type: string
          pattern: ^(asc|desc)$
          default: desc
          title: Sortdirection
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ProjectOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/projects/{id}:
    get:
      tags:
      - Projects
      summary: Get a single project with member and sprint statistics
      description: Returns the project together with embedded `stats` (member and sprint counts). The
        caller must be a member of the project — otherwise the API returns `404 Not Found` (membership
        is not leaked to outsiders).
      operationId: get_project_api_projects__id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetailOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Projects
      summary: Partially update a project
      description: Partial update of a project's name, description or status. Empty body returns `400`.
        Requires the caller to be a member of the project.
      operationId: update_project_api_projects__id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Projects
      summary: Archive (soft-delete) a project
      description: Soft-deletes the project by transitioning its `status` to `archived`. The row stays
        in the database so historical data (sprints, tasks, comments) remains queryable. Requires the
        caller to be a project member.
      operationId: delete_project_api_projects__id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/projects/{id}/members:
    post:
      tags:
      - Projects
      summary: Add a user to a project (requires project_owner or scrum_master role)
      description: Adds an existing user (looked up by email) to the project with one or more project
        roles. Returns `404` if the email is unknown, `409` if the user is already a member, `403` if
        the caller does not have `project_owner` or `scrum_master`.
      operationId: add_member_api_projects__id__members_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMemberCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Projects
      summary: List project members with optional role/search filtering
      description: Paginated list of project members. Optional `role` filter narrows to a single project
        role; optional `search` matches against first name, last name and email (case-insensitive). Only
        project members may call this endpoint.
      operationId: list_members_api_projects__id__members_get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      - name: role
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ProjectMemberOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/projects/{id}/members/{user_id}:
    delete:
      tags:
      - Projects
      summary: Remove a user from a project (requires project_owner or scrum_master role)
      description: Removes a member from the project. Requires `project_owner` or `scrum_master`. Returns
        `404` if the membership does not exist.
      operationId: remove_member_api_projects__id__members__user_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Projects
      summary: Update roles of a project member (requires project_owner or scrum_master role)
      description: Replaces the member's project roles with the supplied list (`roles`). At least one
        role is required. Returns `403` for callers without `project_owner` or `scrum_master`.
      operationId: update_member_roles_api_projects__id__members__user_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMemberUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/projects/{id}/sprints:
    post:
      tags:
      - Projects
      summary: Create a sprint in a project
      description: Creates a sprint with `status=planned`. `endDate` must be strictly later than `startDate`,
        otherwise the API returns `400`. Only project members can create sprints.
      operationId: create_sprint_api_projects__id__sprints_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SprintCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SprintOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Projects
      summary: List all sprints for a project ordered by start date
      description: Returns every sprint belonging to the project, ordered by `startDate` ascending. Non-members
        get `404`.
      operationId: list_sprints_api_projects__id__sprints_get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SprintOut'
                title: Response List Sprints Api Projects  Id  Sprints Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/sprints/{id}:
    patch:
      tags:
      - Projects
      summary: Partially update a sprint
      description: Partial update of a sprint (name, dates, goal, status). Use `status=active` to start
        a sprint and `status=completed` to close it. Empty body returns `400`.
      operationId: update_sprint_api_sprints__id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SprintUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SprintOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Projects
      summary: Delete a sprint
      description: Hard-deletes a sprint. Tasks previously linked to the sprint have their `sprintId`
        cleared rather than being deleted.
      operationId: delete_sprint_api_sprints__id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/sprints/{id}/burndown:
    get:
      tags:
      - Projects
      summary: Get burndown chart data for a sprint
      description: Returns one data point per day between `startDate` and `endDate` (inclusive). Each
        point reports the sum of story points of tasks not yet in `Done`, letting the frontend plot a
        classic burndown chart.
      operationId: get_burndown_api_sprints__id__burndown_get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BurndownOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/projects/{id}/tasks:
    post:
      tags:
      - Tasks
      summary: Create Task
      description: Utworzenie nowego zadania w backlogu.
      operationId: create_task_api_projects__id__tasks_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkItemCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkItemResponse'
        '403':
          description: Caller is not a member of the project
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Tasks
      summary: Get Tasks
      description: Pobranie zadań w projekcie z opcjonalnym filtrowaniem.
      operationId: get_tasks_api_projects__id__tasks_get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: assigneeId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Assigneeid
      - name: sprintId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sprintid
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkItemResponse'
                title: Response Get Tasks Api Projects  Id  Tasks Get
        '403':
          description: Caller is not a member of the project
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
